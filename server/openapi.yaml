openapi: 3.0.3
info:
  title: ProjectHelper Timeline API
  description: |
    프로젝트 타임라인(간트 차트) 데이터를 조작하는 REST API.
    AI 에이전트가 작업(Task) 단위로 일정을 읽고 수정할 수 있도록 설계됨.

    ## 동시성 (리비전)
    - 모든 변경 응답에 `revision`(정수)이 포함된다. 데이터가 바뀔 때마다 1씩 증가.
    - 변경 요청에 `If-Match: <revision>` 헤더를 보내면 서버 리비전과 다를 때 409를 반환한다.
    - 헤더를 생략하면 무조건 쓰기(last-write-wins) — 기존 클라이언트 하위호환.
    - 브라우저 앱은 10초마다 `GET /api/revision`을 폴링해 외부 변경을 자동 반영한다.

    ## 인증 (계정이 있을 때만)
    - 서버에 계정이 하나도 없으면 `open` 모드다 — 인증 없이 지금까지처럼 동작한다.
    - 첫 관리자를 만든 뒤에는 모든 경로에 신원이 필요하다. 예외는 정확히
      `/`, `/guide`, `/openapi.yaml`, `/health`, `/auth/*` 뿐이다.
    - 사람은 세션 쿠키(`POST /auth/login`), **에이전트는 서비스 토큰**을 쓴다:
      `Authorization: Bearer <token>` (서버의 `PH_API_TOKENS` 에 `이름:역할:토큰` 으로 등록).
      감사 로그의 actor 는 그 이름이 되므로 사람 계정을 빌려 쓰지 않는다.
    - 역할은 viewer(읽기) ⊂ editor(쓰기) ⊂ admin(계정·프로젝트 삭제).
      권한이 모자라면 403, 신원이 없으면 401.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: 로컬 API 서버 (dev는 vite proxy 경유 :5173/api)
  - url: https://{host}/api
    description: Caddy HTTPS 프록시 (basicauth 필요)
    variables:
      host:
        default: localhost

security:
  - serviceToken: []
  - {}   # 계정이 없는 배포(open 모드)에서는 인증 없이 호출된다

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: PH_API_TOKENS 에 등록된 서비스 토큰. 사람 사용자는 세션 쿠키를 쓴다.
    session:
      type: apiKey
      in: cookie
      name: ph_session
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string }
      description: 기대하는 현재 리비전. 불일치 시 409.
  schemas:
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error: { type: string }
        revision: { type: integer }
    TimeRange:
      type: object
      properties:
        id: { type: string }
        startDate: { type: string, format: date, example: "2026-07-21" }
        endDate: { type: string, format: date }
        dependencies:
          type: array
          items: { type: string }
          description: 선행 엔티티 ID 목록 (range/milestone/task ID)
        color: { type: string, nullable: true, example: "#4A90E2" }
        label: { type: string }
    Milestone:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date }
        label: { type: string }
        color: { type: string, example: "#5CB85C" }
        shape: { type: string, enum: [diamond, circle, triangle, square, star, flag] }
        labelPosition:
          type: string
          enum: [auto, top, bottom, left, right]
          description: auto(기본)는 서로 겹치지 않게 자동 배치. 손으로 고른 값은 그 자리를 먼저 차지한다.
        dependencies:
          type: array
          items: { type: string }
          description: 선행 엔티티 ID 목록 (range/milestone ID)
    Task:
      type: object
      description: 재귀 트리 노드. 날짜 정보는 timeRanges가 원본이며 startDate/endDate는 파생 캐시.
      properties:
        id: { type: string, example: "task-1784537581275-fe7oo66" }
        name: { type: string }
        timeRanges:
          type: array
          items: { $ref: '#/components/schemas/TimeRange' }
        color: { type: string }
        description: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100, description: 진행률 % }
        children:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        expanded: { type: boolean }
        labels:
          type: array
          items: { type: string }
        parentId: { type: string, nullable: true }
        milestones:
          type: array
          items: { $ref: '#/components/schemas/Milestone' }
        dependencies:
          type: array
          items: { type: string }
          description: 레거시 — 로드 시 첫 timeRange로 마이그레이션되어 항상 빈 배열
        divider:
          type: object
          properties:
            enabled: { type: boolean }
            thickness: { type: integer }
            style: { type: string }
            color: { type: string }
  responses:
    NotFound:
      description: 대상 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 리비전 불일치 (If-Match)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /:
    get:
      summary: API 루트 — AI 셀프 디스커버리 진입점 (start_here → /guide)
      responses:
        '200':
          description: '{ ok, name, start_here, openapi, endpoints[] }'

  /projects:
    get:
      summary: 프로젝트 목록 (각 프로젝트는 독립된 작업 트리/리비전/스냅샷)
      responses:
        '200':
          description: '{ ok, projects: [{id, name, owner, createdAt, updatedAt}] }'
    post:
      summary: 프로젝트 생성 — 새 일정 계획은 새 프로젝트에 작성 권장
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201': { description: '{ ok, project }' }

  /projects/{pid}:
    parameters:
      - name: pid
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: 프로젝트 이름 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: 비어 있지 않은 새 이름 }
      responses:
        '200': { description: '{ ok, project }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: 프로젝트 삭제 (마지막 프로젝트는 400, 데이터는 _trash로 보존)
      responses:
        '200': { description: '{ ok }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # 아래 경로 중 **프로젝트 데이터에 속하는 것**은 두 형태로 제공된다:
  #   /projects/{pid}/...  — 프로젝트 스코프 (권장)
  #   /...                 — default 프로젝트 별칭 (하위호환)
  # 서버 전역인 것에는 스코프 형태가 없다 — 있는 줄 알고 부르면 404 다:
  #   /guide  /openapi.yaml  /health  /metrics  /settings  /auth/*  /users*

  /openapi.yaml:
    get:
      summary: 이 스펙 문서 자체 (text/yaml, 인증 예외)
      responses:
        '200': { description: OpenAPI 3.0 문서 }

  /guide:
    get:
      summary: AI 에이전트용 사용 가이드 (데이터 모델·형식·계획 작성 워크플로우·동시성 규약)
      responses:
        '200':
          description: '{ ok, guide }'

  /revision:
    get:
      summary: 현재 데이터 리비전 조회 (폴링용)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  revision: { type: integer }
                  updatedAt: { type: string, format: date-time }

  /data:
    get:
      summary: 전체 작업 트리 조회 (통짜 블롭)
      responses:
        '200':
          description: OK. 데이터 없으면 data=null
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  revision: { type: integer }
                  data:
                    type: array
                    nullable: true
                    items: { $ref: '#/components/schemas/Task' }
    post:
      summary: 전체 작업 트리 교체 (통짜 블롭 — 주의해서 사용)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Task' }
      responses:
        '200': { description: 'OK { ok, revision }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks:
    get:
      summary: 작업 목록 (트리 또는 평탄화)
      parameters:
        - name: flat
          in: query
          schema: { type: string, enum: ['true'] }
          description: '"true"면 children 없이 level/parentId가 붙은 평탄 목록'
      responses:
        '200':
          description: '{ ok, revision, tasks }'
    post:
      summary: 작업 생성
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parentId: { type: string, nullable: true }
                position: { type: integer, description: 형제 내 삽입 위치 (기본 맨 뒤) }
                startDate: { type: string, format: date, description: endDate와 함께 지정 시 첫 timeRange 생성 }
                endDate: { type: string, format: date }
                color: { type: string }
                description: { type: string }
                labels: { type: array, items: { type: string } }
      responses:
        '201': { description: '{ ok, revision, task }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: 작업 단건 조회
      responses:
        '200': { description: '{ ok, revision, task, parentId }' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: 작업 필드 부분 수정 (name/color/description/expanded/labels/divider/progress)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                color: { type: string }
                description: { type: string }
                expanded: { type: boolean }
                labels: { type: array, items: { type: string } }
                divider: { type: object }
                progress: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200': { description: '{ ok, revision, task }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: 작업 삭제 (하위 작업 포함)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { description: '{ ok, revision }' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{id}/move:
    post:
      summary: 작업 이동 (재부모화/순서 변경)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentId]
              properties:
                parentId: { type: string, nullable: true, description: null이면 루트 레벨 }
                position: { type: integer }
      responses:
        '200': { description: '{ ok, revision, task }' }
        '400': { description: 자기 서브트리로 이동 시 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{id}/time-ranges:
    post:
      summary: 기간(바) 추가 — 작업의 startDate/endDate 캐시 자동 재계산
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, endDate]
              properties:
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                label: { type: string }
                color: { type: string, nullable: true }
                dependencies:
                  type: array
                  items: { type: string }
                  description: >
                    선행 엔티티 id (작업/기간/마일스톤). 존재하지 않는 id 이거나
                    순환을 닫는 연결이면 400. 점검은 GET /dependency-issues.
      responses:
        '201': { description: '{ ok, revision, timeRange }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{id}/time-ranges/{rangeId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: rangeId
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: 기간 수정 (날짜/라벨/색/의존성)
      description: >
        cascade=true 면 이 기간의 종료일이 **뒤로 밀린 일수만큼** 후행(전이적 포함)
        전체를 같은 쓰기에서 민다 — 리비전 하나, 감사 한 줄. 앞당김(delta < 0)은
        전파하지 않는다: 사람이 잡아 둔 간격을 지우는 쪽이 더 큰 손실이다.
        응답에 cascaded(움직인 엔티티 id 목록)와 cascadeDays 가 붙는다.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - name: cascade
          in: query
          schema: { type: boolean, default: false }
        - name: workdays
          in: query
          schema: { type: boolean, default: false }
          description: cascade 로 옮긴 날짜가 주말이면 다음 평일로 (공휴일 달력은 없다)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                label: { type: string }
                color: { type: string, nullable: true }
                dependencies: { type: array, items: { type: string } }
      responses:
        '200': { description: '{ ok, revision, timeRange, cascaded?, cascadeDays? }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: 기간 삭제
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { description: '{ ok, revision }' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{id}/milestones:
    post:
      summary: 마일스톤 추가
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                label: { type: string }
                color: { type: string }
                shape: { type: string, enum: [diamond, circle, triangle, square, star, flag] }
                labelPosition: { type: string, enum: [auto, top, bottom, left, right] }
                dependencies: { type: array, items: { type: string } }
      responses:
        '201': { description: '{ ok, revision, milestone }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{id}/milestones/{milestoneId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: milestoneId
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: 마일스톤 수정 (날짜/라벨/도형/색/라벨위치/의존성)
      description: >
        **삭제 후 재생성으로 대신하지 마라** — id 가 바뀌고, 이 마일스톤을 가리키던
        dependencies 는 삭제 시점에 함께 정리되므로(pruneDependencies) 연결이 사라진다.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                date: { type: string, format: date }
                label: { type: string }
                color: { type: string }
                shape: { type: string, enum: [diamond, circle, triangle, square, star, flag] }
                labelPosition: { type: string, enum: [auto, top, bottom, left, right] }
                dependencies: { type: array, items: { type: string } }
      responses:
        '200': { description: '{ ok, revision, milestone }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: 마일스톤 삭제
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { description: '{ ok, revision }' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /dependency-issues:
    get:
      summary: 의존성 정합성 점검 — 순환·일정 위반·끊어진 참조
      description: >
        브라우저 화면(타임라인 화살표·인스펙터 배지)이 쓰는 것과 같은 판정이다.
        순환과 존재하지 않는 id 참조는 기간 쓰기 시점에 400 으로 차단되지만,
        일정 위반과 (작업 삭제로 생긴) 끊어진 참조는 사후에만 드러나므로 여기서 본다.
        overlaps 의 days 는 후행 시작이 선행 종료보다 며칠 이른지다.
        같은 날 인계(후행 시작 = 선행 종료)는 위반으로 세지 않는다.
        edges 는 문제와 무관한 **연결 전체**다 — 연결을 걸기 전에 현재 그래프를
        읽는 유일한 경로이며, 끊어진 참조는 edges 가 아니라 dangling 이 말한다.
      responses:
        '200':
          description: >
            { ok, revision,
            edges: [{fromId, fromName, toId, toName}],
            cycles: [{ids, names}],
            overlaps: [{fromId, toId, fromName, toName, fromEnd, toStart, days}],
            dangling: [{holderId, holderName, missingId}] }

  /critical-path:
    get:
      summary: 임계경로와 여유(slack)
      description: >
        날짜는 이미 사람이 정한 값이므로 전진 계산(가장 이른 시작)을 하지 않는다 —
        후진 계산만으로 "이것이 며칠 늦어도 프로젝트 종료가 밀리지 않는가"를 답한다.
        LF(n) = min(후행들의 LS), 후행이 없으면 프로젝트 종료일.
        slack 0 이하가 임계다. 순환이 있으면 위상 순서가 없으므로 400 —
        /dependency-issues 로 먼저 고쳐야 한다. 주말은 여유로 세지 않은
        slackWorkdays 를 함께 준다(공휴일 달력은 없다).
      responses:
        '200':
          description: >
            { ok, revision, projectEnd,
            nodes: [{id, name, type, start, end, latestStart, latestFinish,
            slackDays, slackWorkdays, critical}],
            criticalIds: [id] }
        '400': { $ref: '#/components/responses/BadRequest' }

  /chart:
    get:
      summary: 텍스트 간트 렌더 — 에이전트가 자기가 쓴 결과를 확인하는 수단
      description: >
        AI 는 화면을 볼 수 없으므로, 쓰기만 있고 그림이 없으면 결과가 읽을 만한지
        판정할 수단이 0 이다. 대량 편집 뒤 한 번 호출해 막대 위치를 확인한다.
      parameters:
        - name: width
          in: query
          schema: { type: integer, minimum: 40, maximum: 400, default: 100 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: maxRows
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: format
          in: query
          schema: { type: string, enum: [json, text], default: json }
          description: text 면 text/plain 본문만 (JSON 이스케이프 없이 그대로 읽힌다)
      responses:
        '200': { description: '{ ok, revision, chart } — format=text 면 text/plain' }

  /batch:
    post:
      summary: 여러 변경을 한 번의 쓰기로 (전부 아니면 전무)
      description: >
        ops 를 순서대로 **같은 트랜잭션** 안에서 적용한다 — 리비전 하나, 감사 한 줄,
        하나가 실패하면 앞선 것까지 되돌린다. 단건 엔드포인트와 **같은 뮤테이터**를
        쓰므로 검증·순환 차단이 동일하다. blob POST /data 를 대체하는 경로다:
        저것은 트리 전체를 덮어써서 남의 편집을 지우지만, 이것은 조작만 보낸다.
        ref: 이 op 이 만든 것을 뒤에서 가리킬 이름. 뒤의 op 은 `@이름`(작업 id) /
        `@이름:range`(그 작업의 첫 기간 id)로 참조한다 — 부모-자식 트리와 연결을
        한 번에 만들 수 있다. 최대 200개.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [op]
                    properties:
                      op:
                        type: string
                        enum: [create-task, update-task, delete-task, move-task,
                               add-time-range, update-time-range, delete-time-range,
                               add-milestone, update-milestone, delete-milestone]
                      ref: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
                      taskId: { type: string }
                      rangeId: { type: string }
                      milestoneId: { type: string }
                      body: { type: object }
            example:
              ops:
                - op: create-task
                  ref: design
                  body: { name: 설계, startDate: "2026-01-01", endDate: "2026-01-31" }
                - op: create-task
                  body: { name: 요구사항 정리, parentId: "@design", startDate: "2026-01-01", endDate: "2026-01-10" }
                - op: create-task
                  ref: dev
                  body: { name: 개발, startDate: "2026-02-01", endDate: "2026-03-31" }
                - op: update-time-range
                  taskId: "@dev"
                  rangeId: "@dev:range"
                  body: { dependencies: ["@design:range"] }
      responses:
        '200': { description: '{ ok, revision, applied, results: [...] }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /snapshots:
    get:
      summary: 스냅샷(이름 지정 백업) 목록
      responses:
        '200': { description: '{ ok, data: [{id, name, date, data}] }' }
    post:
      summary: 스냅샷 저장 (대량 편집 전 백업 권장)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, data]
              properties:
                name: { type: string }
                data: { type: array, items: { $ref: '#/components/schemas/Task' } }
      responses:
        '200': { description: '{ ok, snapshot }' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /snapshots/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      summary: 스냅샷 덮어쓰기 (같은 이름/자리에 현재 상태를 다시 저장)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                data: { type: array, items: { $ref: '#/components/schemas/Task' } }
      responses:
        '200': { description: '{ ok, snapshot }' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: 스냅샷 삭제
      responses:
        '200': { description: '{ ok }' }
        '404': { $ref: '#/components/responses/NotFound' }

  /settings:
    get:
      summary: 전역 뷰 설정 조회
      description: >
        **프로젝트 스코프 밖이다** — 서버에 하나뿐인 전역 blob 이고
        `/projects/{pid}/settings` 는 없다. 다크모드·시간축·확대율 같은
        화면 표시 설정만 들어 있으며 일정 데이터는 없다.
      responses:
        '200': { description: '{ ok, data: {키: 스칼라} }' }
    post:
      summary: 전역 뷰 설정 변경 (보낸 키만 **병합**)
      description: >
        보내지 않은 키는 그대로 남는다 — 통짜 덮어쓰기였을 때, 설정 하나만 담은
        요청이 사용자의 나머지 뷰 설정을 전부 지웠다. 값은 문자열·숫자·불리언·null
        만 허용하고(중첩 객체·배열은 400), 키는 `[A-Za-z0-9_]{1,40}`, 최대 64개다.
        키 목록은 검증하지 않는다: 클라이언트 settingsStore.js 가 유일한 목록이고
        그것을 서버에 베껴 두면 설정을 추가할 때마다 두 곳이 갈라진다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                nullable: true
                oneOf:
                  - { type: string, maxLength: 200 }
                  - { type: number }
                  - { type: boolean }
            example: { darkMode: true, timeScale: week }
      responses:
        '200': { description: '{ ok, data: 병합된 전체 설정 }' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /events:
    get:
      summary: 감사 로그 — 이 프로젝트의 쓰기 이력(최신순, append-only)
      description: >
        모든 트리/스냅샷 쓰기가 한 줄씩 남는다. 되돌리기 용도가 아니라 추적용이다
        ("누가 언제 몇 개를 지웠는가"). 복구는 스냅샷과 세대 백업이 담당한다.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
      responses:
        '200':
          description: '{ ok, data: [{ts, actor, op, revision, nodes, prevNodes}] }'

  /health:
    get:
      summary: 헬스체크
      responses:
        '200': { description: '{ ok, time }' }

  /metrics:
    get:
      summary: 운영 지표 — 가동시간·요청수·상태코드 분포·마지막 변경 시각
      description: >-
        헬스체크와 달리 **인증이 필요하다**(강제 모드에서 viewer 이상). 프로세스 안의
        카운터라 재시작하면 0으로 돌아가며, uptimeSec 이 그 사실을 함께 알려준다.
        프로젝트 이름 같은 식별 정보는 담지 않는다.
      parameters:
        - in: query
          name: format
          required: false
          schema: { type: string, enum: [prometheus] }
          description: 지정하면 Prometheus 텍스트 노출 형식으로 응답한다 (기본은 JSON)
      responses:
        '200':
          description: '{ ok, metrics: {uptimeSec, startedAt, node, memory, requests, mutations, lastErrorAt} }'

  /auth/me:
    get:
      summary: 현재 신원과 인증 모드 — 화면이 로그인 창을 띄울지 정하는 근거
      security: []
      responses:
        '200': { description: "{ ok, mode: 'open'|'enforced', user: {name, role} | null }" }

  /auth/login:
    post:
      summary: 로그인 (세션 쿠키 발급)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                password: { type: string }
      responses:
        '200': { description: '{ ok, user } + Set-Cookie: ph_session' }
        '401': { description: '이름·비밀번호 불일치 (어느 쪽인지 구분해 주지 않는다)' }
        '429': { description: '시도 과다 (15분 내 10회)' }

  /auth/logout:
    post:
      summary: 로그아웃 (쿠키 삭제)
      security: []
      responses:
        '200': { description: '{ ok }' }

  /auth/setup:
    post:
      summary: 첫 관리자 생성 — 계정이 하나도 없을 때만 열린다(이 호출로 인증이 켜진다)
      security: []
      responses:
        '200': { description: '{ ok, user } + Set-Cookie' }
        '409': { description: '이미 계정이 있다' }

  /users:
    get:
      summary: 계정 목록 (admin)
      responses:
        '200': { description: '{ ok, users: [{name, role, createdAt}] }' }
        '403': { description: 'admin 아님' }
    post:
      summary: 계정 생성 (admin)
      responses:
        '201': { description: '{ ok, user }' }
        '409': { description: '같은 이름이 이미 있다' }

  /users/{name}:
    patch:
      summary: 비밀번호·역할 변경 (본인 비밀번호 또는 admin)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: '{ ok, user }' }
        '409': { description: '마지막 관리자는 강등할 수 없다' }
    delete:
      summary: 계정 삭제 (admin)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: '{ ok }' }
        '409': { description: '마지막 관리자는 지울 수 없다' }
