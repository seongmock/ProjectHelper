# 정적 자산 서빙 설정.
#
# 실사 시점 문제: 기본 설정을 쓰고 있어 gzip 이 꺼져 있었고(#gzip on;) Cache-Control 도 없었다.
# → 빌드가 96KB(gzip)로 산출한 JS를 307KB 그대로 전송하고, 매 접속마다 재검증했다.
#
# 압축은 Caddy(`encode zstd gzip`)에서도 하지만, 여기서도 켜 둔다:
#   - Caddy를 우회한 직접 접근(디버깅·컨테이너 간 호출)에도 적용
#   - Cache-Control 은 Caddy가 넣어주지 않으므로 여기가 유일한 지점

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Vite가 만드는 자산 파일명에는 콘텐츠 해시가 들어간다(index-CYpza9jZ.js).
    # 내용이 바뀌면 파일명이 바뀌므로 영구 캐시가 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html 은 절대 캐시하지 않는다 — 새 배포를 즉시 반영해야 한다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 폴백. 현재 클라이언트 라우터는 없지만, 향후 /share/:id 같은 경로가
    # 생겼을 때 404가 나는 것을 막는다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 숨김 파일 차단
    location ~ /\. {
        deny all;
    }
}
