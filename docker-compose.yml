# 주의: `docker compose down -v` 금지.
# api_data 볼륨에 운영 데이터의 유일한 사본이 있다 (백업: ./scripts/backup-data.sh).

services:
  project-management-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-management-app
    restart: always
    expose:
      - "80"
    # 로그가 디스크를 채우지 않게 상한을 둔다
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  project-helper-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: project-helper-api
    restart: always
    expose:
      - "3000"
    environment:
      # 이것이 없으면 Express가 development로 동작해 스택트레이스를 응답에 노출한다
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # 인증은 계정이 만들어지기 전까지 잠들어 있다(server/lib/auth.js). 아래는 켠 뒤에만 쓰인다.
      # 세션 키는 비워 두면 데이터 볼륨에 만들어 재사용한다 — 다시 띄워도 로그아웃되지 않는다.
      PH_SESSION_SECRET: "${PH_SESSION_SECRET:-}"
      # AI·MCP 용 서비스 신원: "이름:역할:토큰" 을 쉼표로. 사람 계정을 빌려 쓰지 않게 한다.
      PH_API_TOKENS: "${PH_API_TOKENS:-}"
      # 앞단(Caddy basicauth·SSO)이 신원을 보증할 때만 1. 켜지 않으면 X-Auth-User 는 무시된다 —
      # 켜 두고 앞단이 없으면 아무나 헤더 한 줄로 관리자가 된다.
      PH_TRUST_PROXY_AUTH: "${PH_TRUST_PROXY_AUTH:-0}"
    volumes:
      - api_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    # 태그 고정 — 부동 태그(caddy:2-alpine)는 무관한 시점에 동작이 바뀔 수 있다
    image: caddy:2.10-alpine
    container_name: caddy-https
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # .env 에서 주입 (.env 는 gitignore 대상). .env.example 참조.
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:?BASIC_AUTH_USER 가 .env 에 설정되어야 합니다}"
      BASIC_AUTH_HASH: "${BASIC_AUTH_HASH:?BASIC_AUTH_HASH 가 .env 에 설정되어야 합니다}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      project-management-app:
        condition: service_started
      project-helper-api:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
  api_data:
